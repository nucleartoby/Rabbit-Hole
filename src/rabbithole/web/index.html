<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabbit Hole</title>
<style>
  :root {
    --bg: #0e0e13;
    --card: #191922;
    --card-hover: #20202c;
    --edge: #2c2c3a;
    --ink: #e8e8f0;
    --muted: #8b8ba0;
    --accent: #8b7cf6;}

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 "Segoe UI", system-ui, sans-serif;}

  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
  #links line { stroke: var(--edge); stroke-width: 2; }

  .card {
    position: absolute; width: 300px; padding: 14px 16px;
    transform: translate(-50%, -50%);
    background: var(--card); border: 1px solid var(--edge); border-radius: 12px;
    cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s;}

  .card:hover { background: var(--card-hover); border-color: #3e3e52; }
  .card.root { width: 400px; border-color: var(--accent); box-shadow: 0 0 40px -12px var(--accent); }
  .card.open { border-color: var(--accent); }
  .card.loading { opacity: .55; }

  .card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .card.root h2 { font-size: 21px; }
  .card p {
    margin: 0; color: var(--muted); font-size: 13px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;}

  .card.root p { -webkit-line-clamp: 10; color: #c3c3d4; }
  .card footer { margin-top: 10px; display: flex; gap: 12px; align-items: center; font-size: 12px; }
  .card .count { color: var(--accent); }
  .card a { color: var(--muted); text-decoration: none; }
  .card a:hover { color: var(--ink); text-decoration: underline; }
  .card img { float: right; width: 74px; border-radius: 6px; margin: 0 0 8px 12px; }

  #search {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    display: flex; width: min(460px, 90vw); z-index: 10;}

  #term {
    flex: 1; padding: 12px 16px; font-size: 16px; font-family: inherit;
    color: var(--ink); background: var(--card);
    border: 1px solid var(--edge); border-right: 0; border-radius: 10px 0 0 10px; outline: none;}

  #term:focus { border-color: var(--accent); }
  #search button {
    padding: 0 18px; font-size: 15px; color: var(--ink); background: var(--card);
    border: 1px solid var(--edge); border-radius: 0 10px 10px 0; cursor: pointer;}

  #search button:hover { background: var(--card-hover); }

  #status {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12.5px; z-index: 10; text-align: center;}

  #fit {
    position: fixed; bottom: 16px; right: 18px; z-index: 10;
    padding: 8px 14px; font: inherit; font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid var(--edge); border-radius: 8px; cursor: pointer;}

  #fit:hover { color: var(--ink); }
</style>
</head>
<body>

<div id="stage">
  <div id="world"><svg id="links"></svg></div>
</div>

<form id="search" autocomplete="off">
  <input id="term" placeholder="car" autofocus>
  <button type="submit">⏎</button>
</form>

<button id="fit" hidden>⤢ fit</button>
<div id="status">Enter a word. Click any card to branch off it. Drag to pan, scroll to zoom.</div>

<script>
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const svg = document.getElementById('links');
const status = document.getElementById('status');
const fitBtn = document.getElementById('fit');

const CARD_W = 340;
const nodes = [];
let view = { x: innerWidth / 2, y: innerHeight / 2, scale: 1 };

function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;}


function addNode(entry, parent) {
  const node = {
    ...entry,
    parent,
    depth: parent ? parent.depth + 1 : 0,
    children: [],
    open: false,
    x: 0, y: 0,
  };
  nodes.push(node);
  if (parent) parent.children.push(node);
  node.el = makeCard(node);
  world.appendChild(node.el);
  return node;}

function ancestors(node) {
  const seen = new Set();
  for (let n = node; n; n = n.parent) seen.add(n.title);
  return seen;}

function descendants(node, out = []) {
  for (const child of node.children) { out.push(child); descendants(child, out); }
  return out;}

function place(parent) {
  const kids = parent.children;
  if (!kids.length) return;

  const spread = parent.parent ? Math.PI * 1.15 : Math.PI * 2;
  const heading = parent.parent
    ? Math.atan2(parent.y - parent.parent.y, parent.x - parent.parent.x)
    : -Math.PI / 2;
  const radius = Math.max(430, (kids.length * CARD_W) / spread);

  kids.forEach((kid, i) => {
    const t = kids.length === 1 ? 0.5 : i / (kids.length - (parent.parent ? 1 : 0));
    const angle = heading + (t - 0.5) * spread;
    const r = radius * (i % 2 ? 1.13 : 1);   // stagger rings so neighbours clear each other
    kid.x = parent.x + Math.cos(angle) * r;
    kid.y = parent.y + Math.sin(angle) * r;
  });}


function makeCard(node) {
  const el = document.createElement('article');
  el.className = 'card' + (node.parent ? '' : ' root');

  if (!node.parent && node.thumbnail) {
    const img = document.createElement('img');
    img.src = node.thumbnail;
    img.alt = '';
    el.appendChild(img);}

  const h2 = document.createElement('h2');
  h2.textContent = node.title;
  const p = document.createElement('p');
  p.textContent = node.summary || 'No summary available.';

  const footer = document.createElement('footer');
  const count = document.createElement('span');
  count.className = 'count';
  const link = document.createElement('a');
  link.href = node.url;
  link.target = '_blank';
  link.rel = 'noreferrer';
  link.textContent = 'Wikipedia ↗';
  link.addEventListener('click', e => e.stopPropagation());
  footer.append(count, link);

  el.append(h2, p, footer);
  el.addEventListener('click', () => toggle(node));
  node.countEl = count;
  return el;}

function draw() {
  for (const node of nodes) {
    node.el.style.left = node.x + 'px';
    node.el.style.top = node.y + 'px';
    node.el.classList.toggle('open', node.open);
    node.countEl.textContent = node.children.length
      ? (node.open ? '▾ ' : '▸ ') + node.children.length
      : '';}

  svg.replaceChildren();
  for (const node of nodes) {
    if (!node.parent) continue;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', node.parent.x);
    line.setAttribute('y1', node.parent.y);
    line.setAttribute('x2', node.x);
    line.setAttribute('y2', node.y);
    svg.appendChild(line);
  }}


async function toggle(node) {
  if (node.children.length) {          // already branched fold it back up
    for (const dead of descendants(node)) {
      dead.el.remove();
      nodes.splice(nodes.indexOf(dead), 1);
    }
    node.children = [];
    node.open = false;
    draw();
    return;}

  node.el.classList.add('loading');
  try {
    const seen = ancestors(node);
    const hole = await fetchHole(node.title, 8);
    for (const entry of hole.more) {
      if (!seen.has(entry.title)) addNode(entry, node);}

    node.open = true;
    if (!node.children.length) status.textContent = `“${node.title}” is a dead end.`;
    place(node);
    draw();
  } catch (err) {
    status.textContent = err.message;
  } finally {
    node.el.classList.remove('loading');}}

async function fetchHole(term, limit) {
  const res = await fetch(`/api/dig?term=${encodeURIComponent(term)}&limit=${limit}`);
  if (!res.ok) throw new Error(`Nothing found for “${term}”.`);
  return res.json();}

async function search(term) {
  status.textContent = `Digging into “${term}”…`;
  history.replaceState(null, '', '?q=' + encodeURIComponent(term));
  let hole;
  try {
    hole = await fetchHole(term, 10);} catch (err) {status.textContent = err.message;
    return;}

  nodes.forEach(n => n.el.remove());
  nodes.length = 0;

  const root = addNode(hole.top, null);
  root.open = true;
  const seen = new Set([hole.top.title]);
  for (const entry of hole.more) {
    if (!seen.has(entry.title)) addNode(entry, root);
  }
  place(root);
  draw();
  fit();
  fitBtn.hidden = false;
  status.textContent = 'Click any card to branch off it. Drag to pan, scroll to zoom.';}

function fit() {
  const pad = 120;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs) - CARD_W / 2, maxX = Math.max(...xs) + CARD_W / 2;
  const minY = Math.min(...ys) - 140, maxY = Math.max(...ys) + 140;

  const scale = Math.min(
    (innerWidth - pad * 2) / (maxX - minX),
    (innerHeight - pad * 2) / (maxY - minY),
    1.1
  );
  view.scale = Math.max(scale, 0.12);
  view.x = innerWidth / 2 - ((minX + maxX) / 2) * view.scale;
  view.y = innerHeight / 2 - ((minY + maxY) / 2) * view.scale;
  applyView();}

document.getElementById('search').addEventListener('submit', e => {
  e.preventDefault();
  const term = document.getElementById('term').value.trim();
  if (term) search(term);});

fitBtn.addEventListener('click', fit);

let pan = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.card')) return;      // clicks on cards belong to the card
  pan = { x: e.clientX - view.x, y: e.clientY - view.y };
  stage.classList.add('panning');
  stage.setPointerCapture(e.pointerId);});

stage.addEventListener('pointermove', e => {
  if (!pan) return;
  view.x = e.clientX - pan.x;
  view.y = e.clientY - pan.y;
  applyView();});

stage.addEventListener('pointerup', () => { pan = null; stage.classList.remove('panning'); });

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const next = Math.min(Math.max(view.scale * Math.exp(-e.deltaY * 0.0015), 0.1), 2.5);
  view.x = e.clientX - (e.clientX - view.x) * (next / view.scale);
  view.y = e.clientY - (e.clientY - view.y) * (next / view.scale);
  view.scale = next;
  applyView();}, { passive: false });

applyView();

// ?q=car opens straight onto a hole handy
const opening = new URLSearchParams(location.search).get('q');
if (opening) {
  document.getElementById('term').value = opening;
  search(opening);}
  
</script>
</body>
</html>
